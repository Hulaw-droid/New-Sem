<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Graduate Group Tracking System</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
    --primary:#073b72;
    --primary-dark:#052b52;
    --background:#f4f6f9;
    --white:#ffffff;
    --text:#1f2937;
    --muted:#6b7280;
    --border:#dfe4ea;
    --success:#198754;
    --danger:#dc3545;
    --warning:#f0ad4e;
    --info:#0d6efd;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--background);
    color:var(--text);
}

button,
input,
select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

/* =========================
   LOGIN
========================= */

.login-screen{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(
        135deg,
        #073b72,
        #0d6efd
    );
    padding:20px;
}

.login-card{
    width:100%;
    max-width:420px;
    background:#fff;
    border-radius:16px;
    padding:40px;
    box-shadow:0 20px 50px rgba(0,0,0,.2);
}

.login-logo{
    width:80px;
    height:80px;
    margin:0 auto 20px;
    border-radius:50%;
    background:#073b72;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    font-weight:bold;
}

.login-title{
    text-align:center;
    color:#073b72;
    margin-bottom:6px;
}

.login-subtitle{
    text-align:center;
    color:#6b7280;
    margin-bottom:30px;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
    font-size:14px;
}

.form-group input{
    width:100%;
    padding:12px 14px;
    border:1px solid var(--border);
    border-radius:8px;
    outline:none;
}

.form-group input:focus{
    border-color:var(--primary);
}

.password-wrap{
    position:relative;
}

.password-wrap input{
    padding-right:45px;
}

.show-password{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:none;
    color:#6b7280;
}

.login-button{
    width:100%;
    border:0;
    background:var(--primary);
    color:#fff;
    padding:13px;
    border-radius:8px;
    font-weight:bold;
    font-size:15px;
}

.login-button:hover{
    background:var(--primary-dark);
}

.login-error{
    color:var(--danger);
    font-size:13px;
    text-align:center;
    margin-top:12px;
}

/* =========================
   APP
========================= */

.app{
    display:none;
    min-height:100vh;
}

.header{
    background:var(--primary);
    color:#fff;
    padding:18px 28px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.header-title{
    font-size:22px;
    font-weight:bold;
}

.logout-button{
    border:1px solid rgba(255,255,255,.5);
    background:transparent;
    color:#fff;
    padding:9px 16px;
    border-radius:7px;
}

.logout-button:hover{
    background:rgba(255,255,255,.12);
}

.container{
    width:100%;
    max-width:1500px;
    margin:auto;
    padding:25px;
}

/* =========================
   DASHBOARD
========================= */

.dashboard{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
    margin-bottom:25px;
}

.dashboard-card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:12px;
    padding:20px;
}

.dashboard-label{
    color:var(--muted);
    font-size:13px;
    margin-bottom:8px;
}

.dashboard-value{
    font-size:30px;
    font-weight:bold;
    color:var(--primary);
}

/* =========================
   GROUP NAVIGATION
========================= */

.group-navigation{
    background:#fff;
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:18px;
}

.group-button{
    border:1px solid var(--border);
    background:#fff;
    color:#374151;
    padding:10px 18px;
    border-radius:7px;
    font-weight:bold;
}

.group-button:hover{
    background:#f3f4f6;
}

.group-button.active{
    background:var(--primary);
    color:#fff;
    border-color:var(--primary);
}

/* =========================
   FILTERS
========================= */

.filters{
    background:#fff;
    border:1px solid var(--border);
    border-radius:12px;
    padding:18px;
    display:grid;
    grid-template-columns:2fr 1fr 1fr 1fr;
    gap:12px;
    margin-bottom:18px;
}

.filter-input,
.filter-select{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--border);
    border-radius:7px;
    background:#fff;
    outline:none;
}

.filter-input:focus,
.filter-select:focus{
    border-color:var(--primary);
}

/* =========================
   ACTION BAR
========================= */

.action-bar{
    display:flex;
    flex-wrap:wrap;
    gap:9px;
    margin-bottom:18px;
}

.action-button{
    border:0;
    border-radius:7px;
    padding:10px 15px;
    font-weight:bold;
}

.add-button{
    background:var(--primary);
    color:#fff;
}

.select-button{
    background:#6c757d;
    color:#fff;
}

.archive-button{
    background:var(--danger);
    color:#fff;
}

.restore-button{
    background:var(--success);
    color:#fff;
}

.action-button:hover{
    opacity:.9;
}

/* =========================
   TABLE
========================= */

.table-container{
    background:#fff;
    border:1px solid var(--border);
    border-radius:12px;
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1100px;
}

thead{
    background:#f1f5f9;
}

th,
td{
    padding:13px 12px;
    border-bottom:1px solid var(--border);
    text-align:left;
    vertical-align:middle;
}

th{
    color:#374151;
    font-size:13px;
    white-space:nowrap;
}

td{
    font-size:14px;
}

tbody tr:hover{
    background:#fafafa;
}

.checkbox-cell{
    width:45px;
    text-align:center;
}

.student-name{
    font-weight:bold;
}

.thesis-title{
    max-width:300px;
    white-space:normal;
    line-height:1.4;
}

.empty-state{
    text-align:center;
    padding:50px 20px;
    color:var(--muted);
}

/* =========================
   BADGES
========================= */

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
    white-space:nowrap;
}

.complete{
    background:#d1e7dd;
    color:#146c43;
}

.pending{
    background:#f8d7da;
    color:#b02a37;
}

.program-phd{
    background:#1976d2;
    color:#fff;
}

.program-maed{
    background:#8ecae6;
    color:#123;
}

.program-mba{
    background:#8e6bbf;
    color:#fff;
}

.program-mpa{
    background:#176b3a;
    color:#fff;
}

.program-mscj{
    background:#f5a6a6;
    color:#4a1111;
}

/* =========================
   FILE AREA
========================= */

.file-box{
    display:flex;
    align-items:center;
    min-width:180px;
}

.file-info{
    display:flex;
    align-items:center;
    gap:7px;
    flex-wrap:wrap;
}

.file-name{
    max-width:150px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-size:12px;
    color:#374151;
}

.file-view-button{
    border:1px solid var(--primary);
    background:#fff;
    color:var(--primary);
    padding:4px 9px;
    border-radius:5px;
    font-size:12px;
    font-weight:bold;
}

.file-view-button:hover{
    background:var(--primary);
    color:#fff;
}

/* =========================
   ACTIONS
========================= */

.row-actions{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

.row-button{
    border:0;
    border-radius:5px;
    padding:6px 9px;
    font-size:12px;
    font-weight:bold;
}

.edit-button{
    background:#0d6efd;
    color:#fff;
}

.archive-row-button{
    background:#dc3545;
    color:#fff;
}

.restore-row-button{
    background:#198754;
    color:#fff;
}

.delete-button{
    background:#6c757d;
    color:#fff;
}

/* =========================
   MODAL
========================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:1000;
    padding:20px;
    overflow:auto;
}

.modal.show{
    display:flex;
    align-items:center;
    justify-content:center;
}

.modal-content{
    width:100%;
    max-width:650px;
    background:#fff;
    border-radius:12px;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
    overflow:hidden;
}

.modal-header{
    padding:18px 20px;
    background:var(--primary);
    color:#fff;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.modal-title{
    font-size:18px;
    font-weight:bold;
}

.close-button{
    border:0;
    background:transparent;
    color:#fff;
    font-size:25px;
    line-height:1;
}

.modal-body{
    padding:20px;
}

.modal-footer{
    padding:15px 20px;
    border-top:1px solid var(--border);
    display:flex;
    justify-content:flex-end;
    gap:8px;
}

.modal-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.modal-group{
    margin-bottom:15px;
}

.modal-group.full{
    grid-column:1/-1;
}

.modal-group label{
    display:block;
    font-weight:bold;
    font-size:13px;
    margin-bottom:6px;
}

.modal-group input,
.modal-group select,
.modal-group textarea{
    width:100%;
    padding:10px;
    border:1px solid var(--border);
    border-radius:7px;
    outline:none;
}

.modal-group textarea{
    min-height:90px;
    resize:vertical;
}

.modal-group input:focus,
.modal-group select:focus,
.modal-group textarea:focus{
    border-color:var(--primary);
}

.save-button{
    border:0;
    background:var(--primary);
    color:#fff;
    padding:10px 18px;
    border-radius:7px;
    font-weight:bold;
}

.cancel-button{
    border:1px solid var(--border);
    background:#fff;
    padding:10px 18px;
    border-radius:7px;
}

/* =========================
   FILE VIEW MODAL
========================= */

.file-modal-content{
    width:100%;
    max-width:1000px;
    height:90vh;
    background:#fff;
    border-radius:12px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

.file-preview{
    flex:1;
    overflow:auto;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:#f4f6f9;
}

.file-preview iframe{
    width:100%;
    height:100%;
    border:0;
}

.file-preview img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
}

.file-message{
    color:var(--muted);
    text-align:center;
    padding:30px;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    right:20px;
    bottom:20px;
    background:#212529;
    color:#fff;
    padding:13px 18px;
    border-radius:8px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
    transform:translateY(120px);
    opacity:0;
    transition:.25s;
    z-index:2000;
}

.toast.show{
    transform:translateY(0);
    opacity:1;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1000px){

    .dashboard{
        grid-template-columns:repeat(2,1fr);
    }

    .filters{
        grid-template-columns:1fr 1fr;
    }

}

@media(max-width:650px){

    .header{
        padding:15px;
    }

    .header-title{
        font-size:17px;
    }

    .container{
        padding:15px;
    }

    .dashboard{
        grid-template-columns:1fr;
    }

    .filters{
        grid-template-columns:1fr;
    }

    .modal-grid{
        grid-template-columns:1fr;
    }

    .modal-group.full{
        grid-column:auto;
    }

    .login-card{
        padding:25px;
    }

}

</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<div
    id="loginScreen"
    class="login-screen">

    <div class="login-card">

        <div class="login-logo">
            GT
        </div>

        <h1 class="login-title">
            Graduate Tracker
        </h1>

        <p class="login-subtitle">
            Graduate Group Tracking System
        </p>

        <div class="form-group">

            <label for="loginUsername">
                Username
            </label>

            <input
                type="text"
                id="loginUsername"
                placeholder="Enter username">

        </div>

        <div class="form-group">

            <label for="loginPassword">
                Password
            </label>

            <div class="password-wrap">

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter password">

                <button
                    type="button"
                    class="show-password"
                    onclick="togglePassword()">

                    👁

                </button>

            </div>

        </div>

        <button
            type="button"
            class="login-button"
            onclick="login()">

            Login

        </button>

        <div
            id="loginError"
            class="login-error">
        </div>

    </div>

</div>


<!-- =========================
     APPLICATION
========================= -->

<div
    id="app"
    class="app">

    <header class="header">

        <div class="header-title">
            Graduate Group Tracking System
        </div>

        <button
            type="button"
            class="logout-button"
            onclick="logout()">

            Logout

        </button>

    </header>


    <main class="container">

        <!-- DASHBOARD -->

        <section class="dashboard">

            <div class="dashboard-card">

                <div class="dashboard-label">
                    Total Students
                </div>

                <div
                    id="totalStudents"
                    class="dashboard-value">
                    0
                </div>

            </div>


            <div class="dashboard-card">

                <div class="dashboard-label">
                    Files Complete
                </div>

                <div
                    id="filesComplete"
                    class="dashboard-value">
                    0
                </div>

            </div>


            <div class="dashboard-card">

                <div class="dashboard-label">
                    Thesis Complete
                </div>

                <div
                    id="thesisComplete"
                    class="dashboard-value">
                    0
                </div>

            </div>


            <div class="dashboard-card">

                <div class="dashboard-label">
                    Overall Complete
                </div>

                <div
                    id="overallComplete"
                    class="dashboard-value">
                    0
                </div>

            </div>

        </section>


        <!-- GROUP NAVIGATION -->

        <section class="group-navigation">

            <button
                type="button"
                class="group-button active"
                data-group="All Groups"
                onclick="setGroup('All Groups',this)">

                All Groups

            </button>

            <button
                type="button"
                class="group-button"
                data-group="TAGAYTAY GROUP"
                onclick="setGroup('TAGAYTAY GROUP',this)">

                TAGAYTAY GROUP

            </button>

            <button
                type="button"
                class="group-button"
                data-group="GELINE GROUP"
                onclick="setGroup('GELINE GROUP',this)">

                GELINE GROUP

            </button>

            <button
                type="button"
                class="group-button"
                data-group="BORACAY GROUP"
                onclick="setGroup('BORACAY GROUP',this)">

                BORACAY GROUP

            </button>

        </section>


        <!-- FILTERS -->

        <section class="filters">

            <input
                type="text"
                id="searchInput"
                class="filter-input"
                placeholder="Search student name or thesis title..."
                oninput="renderTable()">


            <select
                id="programFilter"
                class="filter-select"
                onchange="renderTable()">

                <option value="All">
                    All Programs
                </option>

                <option value="MAEd">
                    MAEd
                </option>

                <option value="PhD">
                    PhD
                </option>

                <option value="MBA">
                    MBA
                </option>

                <option value="MPA">
                    MPA
                </option>

                <option value="MSCJ">
                    MSCJ
                </option>

            </select>


            <select
                id="fileFilter"
                class="filter-select"
                onchange="renderTable()">

                <option value="All">
                    All Files
                </option>

                <option value="Complete">
                    Complete
                </option>

                <option value="Not Yet Done">
                    Not Yet Done
                </option>

            </select>


            <select
                id="thesisFilter"
                class="filter-select"
                onchange="renderTable()">

                <option value="All">
                    All Thesis Status
                </option>

                <option value="Complete">
                    Complete
                </option>

                <option value="Pending">
                    Pending
                </option>

            </select>

        </section>


        <!-- ACTION BAR -->

        <section class="action-bar">

            <button
                type="button"
                class="action-button add-button"
                onclick="openStudentModal()">

                + Add Student

            </button>

            <button
                type="button"
                class="action-button select-button"
                onclick="selectAllVisible()">

                Select All

            </button>

            <button
                type="button"
                class="action-button archive-button"
                onclick="archiveSelected()">

                Archive Selected

            </button>

            <button
                type="button"
                class="action-button restore-button"
                onclick="restoreSelected()">

                Restore Selected

            </button>

        </section>


        <!-- TABLE -->

        <section class="table-container">

            <table>

                <thead>

                    <tr>

                        <th class="checkbox-cell">
                            <input
                                type="checkbox"
                                id="selectAllCheckbox"
                                onchange="toggleAllVisible(this.checked)">
                        </th>

                        <th>
                            Student Name
                        </th>

                        <th>
                            Group
                        </th>

                        <th>
                            Program
                        </th>

                        <th>
                            Thesis Title
                        </th>

                        <th>
                            Thesis Status
                        </th>

                        <th>
                            Files
                        </th>

                        <th>
                            Overall Status
                        </th>

                        <th>
                            Actions
                        </th>

                    </tr>

                </thead>

                <tbody id="studentTableBody">
                </tbody>

            </table>

        </section>

    </main>

</div>


<!-- =========================
     STUDENT MODAL
========================= -->

<div
    id="studentModal"
    class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <div
                id="studentModalTitle"
                class="modal-title">

                Add Student

            </div>

            <button
                type="button"
                class="close-button"
                onclick="closeStudentModal()">

                ×

            </button>

        </div>


        <div class="modal-body">

            <div class="modal-grid">

                <div class="modal-group">

                    <label>
                        Student Name
                    </label>

                    <input
                        type="text"
                        id="studentName"
                        placeholder="Enter student name">

                </div>


                <div class="modal-group">

                    <label>
                        Group
                    </label>

                    <select id="studentGroup">

                        <option value="TAGAYTAY GROUP">
                            TAGAYTAY GROUP
                        </option>

                        <option value="GELINE GROUP">
                            GELINE GROUP
                        </option>

                        <option value="BORACAY GROUP">
                            BORACAY GROUP
                        </option>

                    </select>

                </div>


                <div class="modal-group">

                    <label>
                        Program
                    </label>

                    <select id="studentProgram">

                        <option value="MAEd">
                            MAEd
                        </option>

                        <option value="PhD">
                            PhD
                        </option>

                        <option value="MBA">
                            MBA
                        </option>

                        <option value="MPA">
                            MPA
                        </option>

                        <option value="MSCJ">
                            MSCJ
                        </option>

                    </select>

                </div>


                <div class="modal-group">

                    <label>
                        Thesis Status
                    </label>

                    <select id="studentThesisStatus">

                        <option value="Pending">
                            Pending
                        </option>

                        <option value="Complete">
                            Complete
                        </option>

                    </select>

                </div>


                <div class="modal-group full">

                    <label>
                        Thesis Title
                    </label>

                    <textarea
                        id="studentThesisTitle"
                        placeholder="Enter thesis title">
                    </textarea>

                </div>

            </div>

        </div>


        <div class="modal-footer">

            <button
                type="button"
                class="cancel-button"
                onclick="closeStudentModal()">

                Cancel

            </button>

            <button
                type="button"
                class="save-button"
                onclick="saveStudent()">

                Save Student

            </button>

        </div>

    </div>

</div>


<!-- =========================
     FILE VIEW MODAL
========================= -->

<div
    id="fileModal"
    class="modal">

    <div class="file-modal-content">

        <div class="modal-header">

            <div
                id="fileModalTitle"
                class="modal-title">

                File Preview

            </div>

            <button
                type="button"
                class="close-button"
                onclick="closeFileModal()">

                ×

            </button>

        </div>


        <div
            id="filePreview"
            class="file-preview">

        </div>

    </div>

</div>


<!-- TOAST -->

<div
    id="toast"
    class="toast">
</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://yiruvpikzntyiijapknt.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Z95aVweBRCPDWo1XH54GFQ_rrV9GIvk";

const BUCKET_NAME =
    "student-files";

const TABLE_NAME =
    "students";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   STORAGE
========================= */

const STUDENTS_KEY =
    "graduateGroupStudents";

const PENDING_KEY =
    "graduatePendingChanges";

const FILES_KEY =
    "graduateStudentFiles";

const LOGIN_KEY =
    "graduateTrackerLoggedIn";


/* =========================
   DATA
========================= */

let students = [];

let studentFiles =
    JSON.parse(
        localStorage.getItem(FILES_KEY) || "{}"
    );

let currentGroup =
    "All Groups";

let editingStudentId =
    null;


/* =========================
   LOGIN
========================= */

function togglePassword(){

    const input =
        document.getElementById(
            "loginPassword"
        );

    input.type =
        input.type === "password"
        ? "text"
        : "password";
}


function login(){

    const username =
        document
            .getElementById("loginUsername")
            .value
            .trim();

    const password =
        document
            .getElementById("loginPassword")
            .value;

    const error =
        document.getElementById(
            "loginError"
        );

    if(
        username === "admin" &&
        password === "admin123"
    ){

        sessionStorage.setItem(
            LOGIN_KEY,
            "true"
        );

        showApp();

    }else{

        error.textContent =
            "Invalid username or password.";

    }
}


function logout(){

    sessionStorage.removeItem(
        LOGIN_KEY
    );

    document
        .getElementById("app")
        .style.display = "none";

    document
        .getElementById("loginScreen")
        .style.display = "flex";

}


/* =========================
   APP START
========================= */

function showApp(){

    document
        .getElementById("loginScreen")
        .style.display = "none";

    document
        .getElementById("app")
        .style.display = "block";

    loadData();

}


/* =========================
   LOAD DATA
========================= */

async function loadData(){

    students =
        JSON.parse(
            localStorage.getItem(
                STUDENTS_KEY
            ) || "[]"
        );

    try{

        const {
            data,
            error
        } =
        await supabaseClient
            .from(TABLE_NAME)
            .select("*")
            .order(
                "name",
                {
                    ascending:true
                }
            );

        if(
            !error &&
            Array.isArray(data)
        ){

            students =
                data.map(
                    normalizeStudent
                );

            localStorage.setItem(
                STUDENTS_KEY,
                JSON.stringify(students)
            );

        }

    }catch(error){

        console.log(
            "Supabase loading error:",
            error
        );

    }

    renderTable();
    updateDashboard();

}


/* =========================
   NORMALIZE
========================= */

function normalizeStudent(student){

    return {

        id:
            student.id ||
            Date.now() +
            Math.random(),

        name:
            student.name ||
            "",

        group:
            student.group ||
            "TAGAYTAY GROUP",

        program:
            student.program ||
            "MAEd",

        thesis_title:
            student.thesis_title ||
            "",

        thesis_status:
            student.thesis_status ||
            "Pending",

        file_status:
            student.file_status ||
            "Not Yet Done",

        archived:
            Boolean(
                student.archived
            )

    };

}


/* =========================
   SAVE LOCAL
========================= */

function saveLocal(){

    localStorage.setItem(
        STUDENTS_KEY,
        JSON.stringify(students)
    );

    localStorage.setItem(
        FILES_KEY,
        JSON.stringify(studentFiles)
    );

}


/* =========================
   GROUP
========================= */

function setGroup(
    group,
    button
){

    currentGroup =
        group;

    document
        .querySelectorAll(
            ".group-button"
        )
        .forEach(
            item =>
                item.classList.remove(
                    "active"
                )
        );

    button.classList.add(
        "active"
    );

    renderTable();

}


/* =========================
   PROGRAM BADGE
========================= */

function programBadge(
    program
){

    let className =
        "program-" +
        String(program)
            .toLowerCase();

    if(program === "PhD"){
        className = "program-phd";
    }

    if(program === "MAEd"){
        className = "program-maed";
    }

    if(program === "MBA"){
        className = "program-mba";
    }

    if(program === "MPA"){
        className = "program-mpa";
    }

    if(program === "MSCJ"){
        className = "program-mscj";
    }

    return `
        <span class="badge ${className}">
            ${escapeHtml(program)}
        </span>
    `;

}


/* =========================
   FILE STATUS
========================= */

function getFileStatus(
    student
){

    const file =
        studentFiles[
            String(student.id)
        ];

    return (
        file &&
        file.path
    )
    ? "Complete"
    : "Not Yet Done";

}


/* =========================
   FILE DISPLAY
========================= */

function fileUploadButton(
    student
){

    const file =
        studentFiles[
            String(student.id)
        ];

    const hasFile =
        !!(
            file &&
            file.path
        );

    const status =
        hasFile
        ? "Complete"
        : "Not Yet Done";

    return `

        <div class="file-box">

            <div class="file-info">

                <span class="badge ${
                    hasFile
                    ? "complete"
                    : "pending"
                }">

                    ${status}

                </span>

                ${
                    hasFile
                    ? `

                        <span
                            class="file-name"
                            title="${escapeHtml(
                                file.name || ""
                            )}">

                            ${escapeHtml(
                                file.name || ""
                            )}

                        </span>

                        <button
                            type="button"
                            class="file-view-button"
                            onclick="viewStudentFile(
                                '${escapeAttribute(
                                    student.id
                                )}'
                            )">

                            View

                        </button>

                    `
                    : ""
                }

            </div>

        </div>

    `;

}


/* =========================
   OVERALL STATUS
========================= */

function getOverallStatus(
    student
){

    const fileStatus =
        getFileStatus(student);

    const thesisStatus =
        student.thesis_status ||
        "Pending";

    if(
        fileStatus === "Complete" &&
        thesisStatus === "Complete"
    ){

        return `
            <span class="badge complete">
                Complete
            </span>
        `;

    }

    return `
        <span class="badge pending">
            Not Yet Done
        </span>
    `;

}


/* =========================
   VISIBLE STUDENTS
========================= */

function getVisibleStudents(){

    const search =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .trim()
            .toLowerCase();

    const program =
        document
            .getElementById(
                "programFilter"
            )
            .value;

    const fileStatus =
        document
            .getElementById(
                "fileFilter"
            )
            .value;

    const thesisStatus =
        document
            .getElementById(
                "thesisFilter"
            )
            .value;

    return students

        .filter(
            student =>
                !student.archived
        )

        .filter(
            student =>
                currentGroup ===
                "All Groups"
                ||
                student.group ===
                currentGroup
        )

        .filter(
            student =>
                program === "All"
                ||
                student.program ===
                program
        )

        .filter(
            student => {

                if(
                    fileStatus ===
                    "All"
                ){

                    return true;

                }

                return (
                    getFileStatus(
                        student
                    ) === fileStatus
                );

            }
        )

        .filter(
            student =>
                thesisStatus === "All"
                ||
                (
                    student.thesis_status ||
                    "Pending"
                ) === thesisStatus
        )

        .filter(
            student => {

                if(!search){
                    return true;
                }

                return (

                    String(
                        student.name
                    )
                    .toLowerCase()
                    .includes(search)

                    ||

                    String(
                        student.thesis_title
                    )
                    .toLowerCase()
                    .includes(search)

                    ||

                    String(
                        student.group
                    )
                    .toLowerCase()
                    .includes(search)

                );

            }
        )

        .sort(
            (a,b) =>
                String(a.name)
                    .localeCompare(
                        String(b.name)
                    )
        );

}


/* =========================
   RENDER TABLE
========================= */

function renderTable(){

    const body =
        document.getElementById(
            "studentTableBody"
        );

    const visible =
        getVisibleStudents();

    document.getElementById(
        "selectAllCheckbox"
    ).checked = false;

    if(!visible.length){

        body.innerHTML = `

            <tr>

                <td
                    colspan="9"
                    class="empty-state">

                    No students found.

                </td>

            </tr>

        `;

        updateDashboard();

        return;

    }


    body.innerHTML =
        visible.map(
            student => {

                const fileStatus =
                    getFileStatus(
                        student
                    );

                const thesisStatus =
                    student.thesis_status ||
                    "Pending";

                return `

                    <tr>

                        <td class="checkbox-cell">

                            <input
                                type="checkbox"
                                class="student-checkbox"
                                value="${escapeAttribute(
                                    student.id
                                )}">

                        </td>


                        <td>

                            <div class="student-name">

                                ${escapeHtml(
                                    student.name
                                )}

                            </div>

                        </td>


                        <td>

                            ${escapeHtml(
                                student.group
                            )}

                        </td>


                        <td>

                            ${programBadge(
                                student.program
                            )}

                        </td>


                        <td>

                            <div class="thesis-title">

                                ${
                                    student.thesis_title
                                    ? escapeHtml(
                                        student.thesis_title
                                    )
                                    : "No thesis title"
                                }

                            </div>

                        </td>


                        <td>

                            <span class="badge ${
                                thesisStatus ===
                                "Complete"
                                ? "complete"
                                : "pending"
                            }">

                                ${escapeHtml(
                                    thesisStatus
                                )}

                            </span>

                        </td>


                        <td>

                            ${fileUploadButton(
                                student
                            )}

                        </td>


                        <td>

                            ${getOverallStatus(
                                student
                            )}

                        </td>


                        <td>

                            <div class="row-actions">

                                <button
                                    type="button"
                                    class="row-button edit-button"
                                    onclick="editStudent(
                                        '${escapeAttribute(
                                            student.id
                                        )}'
                                    )">

                                    Edit

                                </button>


                                ${
                                    student.archived
                                    ? `

                                        <button
                                            type="button"
                                            class="row-button restore-row-button"
                                            onclick="restoreStudent(
                                                '${escapeAttribute(
                                                    student.id
                                                )}'
                                            )">

                                            Restore

                                        </button>

                                    `
                                    :
                                    `

                                        <button
                                            type="button"
                                            class="row-button archive-row-button"
                                            onclick="archiveStudent(
                                                '${escapeAttribute(
                                                    student.id
                                                )}'
                                            )">

                                            Archive

                                        </button>

                                    `
                                }

                            </div>

                        </td>

                    </tr>

                `;

            }
        )
        .join("");

    updateDashboard();

}


/* =========================
   DASHBOARD
========================= */

function updateDashboard(){

    const active =
        students.filter(
            student =>
                !student.archived
        );

    const completeFiles =
        active.filter(
            student =>
                getFileStatus(
                    student
                ) === "Complete"
        ).length;

    const completeThesis =
        active.filter(
            student =>
                (
                    student.thesis_status ||
                    "Pending"
                ) === "Complete"
        ).length;

    const completeOverall =
        active.filter(
            student =>
                getFileStatus(
                    student
                ) === "Complete"
                &&
                (
                    student.thesis_status ||
                    "Pending"
                ) === "Complete"
        ).length;

    document.getElementById(
        "totalStudents"
    ).textContent =
        active.length;

    document.getElementById(
        "filesComplete"
    ).textContent =
        completeFiles;

    document.getElementById(
        "thesisComplete"
    ).textContent =
        completeThesis;

    document.getElementById(
        "overallComplete"
    ).textContent =
        completeOverall;

}


/* =========================
   ADD STUDENT
========================= */

function openStudentModal(){

    editingStudentId =

    document.getElementById(
        "studentModalTitle"
    ).textContent =
        "Add Student";

        "studentName"

    document.getElementById(
        "studentThesisStatus"

    document.getElementById(
        "studentModal"
    ).classList.add("show");

/* =========================
   EDIT STUDENT
========================= */

function editStudent(id){

    const student =
        students.find(
            item =>
                String(item.id) ===
                String(id)
        );

    if(!student){
        return;
    }

    editingStudentId =
        student.id;

    document.getElementById(
        "studentModalTitle"
    ).textContent =
        "Edit Student";

    document.getElementById(
        "studentName"
    ).value =
        student.name || "";

    document.getElementById(
        "studentGroup"
    ).value =
        student.group || "TAGAYTAY GROUP";

    document.getElementById(
        "studentProgram"
    ).value =
        student.program || "MAEd";

    document.getElementById(
        "studentThesisStatus"
    ).value =
        student.thesis_status ||
        "Pending";

    document.getElementById(
        "studentThesisTitle"
    ).value =
        student.thesis_title || "";

    document.getElementById(
        "studentModal"
    ).classList.add("show");

}


/* =========================
   CLOSE STUDENT MODAL
========================= */

function closeStudentModal(){

    document.getElementById(
        "studentModal"
    ).classList.remove("show");

}


/* =========================
   SAVE STUDENT
========================= */

async function saveStudent(){

    const name =
        document
            .getElementById(
                "studentName"
            )
            .value
            .trim();

    const group =
        document
            .getElementById(
                "studentGroup"
            )
            .value;

    const program =
        document
            .getElementById(
                "studentProgram"
            )
            .value;

    const thesisStatus =
        document
            .getElementById(
                "studentThesisStatus"
            )
            .value;

    const thesisTitle =
        document
            .getElementById(
                "studentThesisTitle"
            )
            .value
            .trim();


    if(!name){

        showToast(
            "Please enter the student name."
        );

        return;

    }


    const existingFile =
        editingStudentId
        ? studentFiles[
            String(editingStudentId)
        ]
        : null;


    const fileStatus =
        existingFile &&
        existingFile.path
        ? "Complete"
        : "Not Yet Done";


    if(editingStudentId){

        const index =
            students.findIndex(
                student =>
                    String(student.id) ===
                    String(editingStudentId)
            );

        if(index !== -1){

            students[index] = {

                ...students[index],

                name:name,

                group:group,

                program:program,

                thesis_title:
                    thesisTitle,

                thesis_status:
                    thesisStatus,

                file_status:
                    fileStatus

            };

        }

    }else{

        const newStudent = {

            id:
                Date.now(),

            name:name,

            group:group,

            program:program,

            thesis_title:
                thesisTitle,

            thesis_status:
                thesisStatus,

            file_status:
                fileStatus,

            archived:false

        };

        students.push(
            newStudent
        );

    }


    saveLocal();

    closeStudentModal();

    renderTable();

    showToast(
        editingStudentId
        ? "Student updated."
        : "Student added."
    );


    try{

        const student =
            editingStudentId
            ? students.find(
                item =>
                    String(item.id) ===
                    String(editingStudentId)
            )
            : students[
                students.length - 1
            ];

        if(student){

            await supabaseClient
                .from(TABLE_NAME)
                .upsert({

                    id:student.id,

                    name:student.name,

                    group:student.group,

                    program:student.program,

                    thesis_title:
                        student.thesis_title,

                    thesis_status:
                        student.thesis_status,

                    file_status:
                        student.file_status,

                    archived:
                        student.archived || false

                });

        }

    }catch(error){

        console.log(
            "Supabase save error:",
            error
        );

    }

}


/* =========================
   ARCHIVE
========================= */

async function archiveStudent(id){

    const student =
        students.find(
            item =>
                String(item.id) ===
                String(id)
        );

    if(!student){
        return;
    }

    student.archived =
        true;

    saveLocal();

    renderTable();

    showToast(
        "Student archived."
    );

    try{

        await supabaseClient
            .from(TABLE_NAME)
            .update({
                archived:true
            })
            .eq(
                "id",
                student.id
            );

    }catch(error){

        console.log(error);

    }

}


/* =========================
   RESTORE
========================= */

async function restoreStudent(id){

    const student =
        students.find(
            item =>
                String(item.id) ===
                String(id)
        );

    if(!student){
        return;
    }

    student.archived =
        false;

    saveLocal();

    renderTable();

    showToast(
        "Student restored."
    );

    try{

        await supabaseClient
            .from(TABLE_NAME)
            .update({
                archived:false
            })
            .eq(
                "id",
                student.id
            );

    }catch(error){

        console.log(error);

    }

}


/* =========================
   SELECT ALL
========================= */

function selectAllVisible(){

    const checkboxes =
        document.querySelectorAll(
            ".student-checkbox"
        );

    const allSelected =
        Array.from(
            checkboxes
        ).every(
            checkbox =>
                checkbox.checked
        );

    checkboxes.forEach(
        checkbox =>
            checkbox.checked =
                !allSelected
    );

    document.getElementById(
        "selectAllCheckbox"
    ).checked =
        !allSelected;

}


function toggleAllVisible(
    checked
){

    document
        .querySelectorAll(
            ".student-checkbox"
        )
        .forEach(
            checkbox =>
                checkbox.checked =
                    checked
        );

}


/* =========================
   GET SELECTED
========================= */

function getSelectedIds(){

    return Array
        .from(
            document.querySelectorAll(
                ".student-checkbox:checked"
            )
        )
        .map(
            checkbox =>
                checkbox.value
        );

}


/* =========================
   ARCHIVE SELECTED
========================= */

async function archiveSelected(){

    const ids =
        getSelectedIds();

    if(!ids.length){

        showToast(
            "Please select at least one student."
        );

        return;

    }

    ids.forEach(
        id => {

            const student =
                students.find(
                    item =>
                        String(item.id) ===
                        String(id)
                );

            if(student){
                student.archived = true;
            }

        }
    );

    saveLocal();

    renderTable();

    showToast(
        `${ids.length} student(s) archived.`
    );


    try{

        await supabaseClient
            .from(TABLE_NAME)
            .update({
                archived:true
            })
            .in(
                "id",
                ids
            );

    }catch(error){

        console.log(error);

    }

}


/* =========================
   RESTORE SELECTED
========================= */

async function restoreSelected(){

    const ids =
        getSelectedIds();

    if(!ids.length){

        showToast(
            "Please select at least one student."
        );

        return;

    }

    ids.forEach(
        id => {

            const student =
                students.find(
                    item =>
                        String(item.id) ===
                        String(id)
                );

            if(student){
                student.archived = false;
            }

        }
    );

    saveLocal();

    renderTable();

    showToast(
        `${ids.length} student(s) restored.`
    );


    try{

        await supabaseClient
            .from(TABLE_NAME)
            .update({
                archived:false
            })
            .in(
                "id",
                ids
            );

    }catch(error){

        console.log(error);

    }

}


/* =========================
   VIEW FILE
========================= */

async function viewStudentFile(
    id
){

    const file =
        studentFiles[
            String(id)
        ];

    if(
        !file ||
        !file.path
    ){

        showToast(
            "No file uploaded."
        );

        return;

    }

    const preview =
        document.getElementById(
            "filePreview"
        );

    const title =
        document.getElementById(
            "fileModalTitle"
        );


    title.textContent =
        file.name ||
        "File Preview";


    preview.innerHTML = `

        <div class="file-message">
            Loading file...
        </div>

    `;


    document.getElementById(
        "fileModal"
    ).classList.add("show");


    try{

        let signedUrl =
            file.url || "";


        if(!signedUrl){

            const result =
                await supabaseClient
                    .storage
                    .from(BUCKET_NAME)
                    .createSignedUrl(
                        file.path,
                        3600
                    );

            if(result.error){

                throw result.error;

            }

            signedUrl =
                result.data.signedUrl;

        }


        const lowerName =
            String(
                file.name || ""
            )
            .toLowerCase();


        if(
            lowerName.endsWith(".pdf")
        ){

            preview.innerHTML = `

                <iframe
                    src="${escapeAttribute(
                        signedUrl
                    )}">
                </iframe>

            `;

        }else if(

            lowerName.endsWith(".jpg")
            ||
            lowerName.endsWith(".jpeg")
            ||
            lowerName.endsWith(".png")
            ||
            lowerName.endsWith(".gif")
            ||
            lowerName.endsWith(".webp")

        ){

            preview.innerHTML = `

                <img
                    src="${escapeAttribute(
                        signedUrl
                    )}"
                    alt="Uploaded file">

            `;

        }else{

            preview.innerHTML = `

                <div class="file-message">

                    File preview is not available
                    for this file type.

                    <br><br>

                    <a
                        href="${escapeAttribute(
                            signedUrl
                        )}"
                        target="_blank">

                        Open File

                    </a>

                </div>

            `;

        }


    }catch(error){

        console.error(error);

        preview.innerHTML = `

            <div class="file-message">

                Unable to preview this file.

            </div>

        `;

    }

}

    document.getElementById(

/* =========================
   TOAST
========================= */

let toastTimer = null;

function showToast(
    message
){

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeAttribute(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    );

}


/* =========================
   MODAL CLICK OUTSIDE
========================= */

document
    .getElementById(
        "studentModal"
    )
    .addEventListener(
        "click",
        function(event){

            if(
                event.target === this
            ){

                closeStudentModal();

            }

        }
    );


document
    .getElementById(
        "fileModal"
    )
    .addEventListener(
        "click",
        function(event){

            if(
                event.target === this
            ){

                closeFileModal();

            }

        }
    );


/* =========================
   ENTER LOGIN
========================= */

document
    .getElementById(
        "loginPassword"
    )
    .addEventListener(
        "keydown",
        function(event){

            if(
                event.key === "Enter"
            ){

                login();

            }

        }
    );


/* =========================
   START
========================= */

if(
    sessionStorage.getItem(
        LOGIN_KEY
    ) === "true"
){

    showApp();

}else{

    document
        .getElementById(
            "loginScreen"
        )
        .style.display = "flex";

}

</script>
