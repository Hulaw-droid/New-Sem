<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graduate Group Tracking System</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f6f9;
    color:#222;
}

header{
    background:#073b72;
    color:white;
    padding:20px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header h1{
    font-size:24px;
}

header span{
    font-size:14px;
    opacity:.9;
}

.container{
    padding:25px;
    max-width:1500px;
    margin:auto;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:25px;
}

.card{
    background:white;
    border-radius:10px;
    padding:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.card h3{
    color:#555;
    font-size:14px;
    margin-bottom:8px;
}

.card .number{
    font-size:30px;
    font-weight:bold;
    color:#073b72;
}

.controls{
    background:white;
    padding:18px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.controls-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

input,select{
    padding:10px 12px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:14px;
    background:white;
}

.search{
    flex:1;
    min-width:220px;
}

button{
    border:none;
    border-radius:6px;
    padding:10px 16px;
    cursor:pointer;
    font-weight:bold;
}

.btn-primary{
    background:#073b72;
    color:white;
}

.btn-success{
    background:#198754;
    color:white;
}

.btn-danger{
    background:#dc3545;
    color:white;
}

.btn-secondary{
    background:#6c757d;
    color:white;
}

.btn-warning{
    background:#f0ad4e;
    color:white;
}

.table-box{
    background:white;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    overflow:hidden;
}

.table-header{
    padding:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.table-header h2{
    color:#073b72;
    font-size:20px;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1050px;
}

th{
    background:#073b72;
    color:white;
    padding:12px;
    text-align:left;
    font-size:13px;
}

td{
    padding:11px 12px;
    border-bottom:1px solid #eee;
    font-size:14px;
    vertical-align:middle;
}

tr:hover{
    background:#f8fbff;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:15px;
    font-size:12px;
    font-weight:bold;
}

.status-paid,
.status-complete{
    background:#d1e7dd;
    color:#0f5132;
}

.status-pending{
    background:#f8d7da;
    color:#842029;
}

.status-progress{
    background:#fff3cd;
    color:#664d03;
}

.program-badge{
    padding:5px 9px;
    border-radius:15px;
    font-weight:bold;
    font-size:12px;
}

.phd{
    background:#1976d2;
    color:white;
}

.maed{
    background:#8ecae6;
    color:#123;
}

.mba{
    background:#8e6bbf;
    color:white;
}

.mpa{
    background:#176b3a;
    color:white;
}

.mscj{
    background:#f5a6a6;
    color:#333;
}

.group-badge{
    background:#e8f0f8;
    color:#073b72;
    padding:5px 8px;
    border-radius:5px;
    font-size:12px;
    font-weight:bold;
}

.actions{
    display:flex;
    gap:5px;
}

.actions button{
    padding:7px 9px;
    font-size:12px;
}

.modal{
    display:none;
    position:fixed;
    z-index:1000;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.5);
    justify-content:center;
    align-items:center;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-content{
    background:white;
    width:600px;
    max-width:100%;
    max-height:90vh;
    overflow-y:auto;
    border-radius:10px;
    padding:25px;
}

.modal-content h2{
    color:#073b72;
    margin-bottom:20px;
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
    font-size:14px;
}

.form-group input,
.form-group select{
    width:100%;
}

.modal-buttons{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:20px;
}

.loading{
    text-align:center;
    padding:30px;
    color:#666;
}

.empty{
    text-align:center;
    padding:40px;
    color:#777;
}

.error-box{
    background:#f8d7da;
    color:#842029;
    padding:12px;
    border-radius:6px;
    margin-bottom:15px;
    display:none;
}

.success-box{
    background:#d1e7dd;
    color:#0f5132;
    padding:12px;
    border-radius:6px;
    margin-bottom:15px;
    display:none;
}

@media(max-width:900px){
    .dashboard{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){
    header{
        padding:15px;
    }

    header h1{
        font-size:18px;
    }

    .container{
        padding:12px;
    }

    .dashboard{
        grid-template-columns:1fr 1fr;
    }

    .card{
        padding:15px;
    }
}
</style>
</head>

<body>

<header>
    <div>
        <h1>Graduate Group Tracking System</h1>
        <span>Graduate Student Monitoring System</span>
    </div>

    <div>
        <span id="connectionStatus">Connecting...</span>
    </div>
</header>

<div class="container">

    <div id="errorBox" class="error-box"></div>
    <div id="successBox" class="success-box"></div>

    <div class="dashboard">

        <div class="card">
            <h3>Total Students</h3>
            <div class="number" id="totalCount">0</div>
        </div>

        <div class="card">
            <h3>Files Complete</h3>
            <div class="number" id="filesComplete">0</div>
        </div>

        <div class="card">
            <h3>Thesis Complete</h3>
            <div class="number" id="thesisComplete">0</div>
        </div>

        <div class="card">
            <h3>Overall Complete</h3>
            <div class="number" id="overallComplete">0</div>
        </div>

    </div>

    <div class="controls">

        <div class="controls-row">

            <input
                type="text"
                id="searchInput"
                class="search"
                placeholder="Search student name or thesis title..."
                oninput="renderTable()"
            >

            <select id="groupFilter" onchange="renderTable()">
                <option value="ALL">All Groups</option>
                <option value="TAGAYTAY GROUP">TAGAYTAY GROUP</option>
                <option value="GELINE GROUP">GELINE GROUP</option>
                <option value="BORACAY GROUP">BORACAY GROUP</option>
            </select>

            <select id="programFilter" onchange="renderTable()">
                <option value="ALL">All Programs</option>
                <option value="MAEd">MAEd</option>
                <option value="PhD">PhD</option>
                <option value="MBA">MBA</option>
                <option value="MPA">MPA</option>
                <option value="MSCJ">MSCJ</option>
            </select>

            <select id="fileFilter" onchange="renderTable()">
                <option value="ALL">All File Status</option>
                <option value="Complete">Complete</option>
                <option value="Pending">Pending</option>
            </select>

            <select id="thesisFilter" onchange="renderTable()">
                <option value="ALL">All Thesis Status</option>
                <option value="Complete">Complete</option>
                <option value="Pending">Pending</option>
            </select>

            <button class="btn-primary" onclick="openAddModal()">
                + Add Student
            </button>

            <button class="btn-secondary" onclick="loadStudents()">
                ↻ Refresh
            </button>

        </div>

    </div>

    <div class="table-box">

        <div class="table-header">

            <h2>Student Records</h2>

            <div>
                <span id="recordCount">0 records</span>
            </div>

        </div>

        <div class="table-wrap">

            <table>

                <thead>
                    <tr>
                        <th>#</th>
                        <th>Student Name</th>
                        <th>Group</th>
                        <th>Program</th>
                        <th>Files</th>
                        <th>Thesis</th>
                        <th>Overall</th>
                        <th>Thesis Title</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="studentTableBody">
                </tbody>

            </table>

        </div>

    </div>

</div>


<!-- ADD / EDIT MODAL -->

<div class="modal" id="studentModal">

    <div class="modal-content">

        <h2 id="modalTitle">Add Student</h2>

        <input type="hidden" id="studentId">

        <div class="form-group">
            <label>Student Name</label>
            <input
                type="text"
                id="studentName"
                placeholder="Enter student name"
            >
        </div>

        <div class="form-group">
            <label>Group</label>

            <select id="studentGroup">

                <option value="TAGAYTAY GROUP">
                    TAGAYTAY GROUP
                </option>

                <option value="GELINE GROUP">
                    GELINE GROUP
                </option>

                <option value="BORACAY GROUP">
                    BORACAY GROUP
                </option>

            </select>

        </div>

        <div class="form-group">

            <label>Program</label>

            <select id="studentProgram">

                <option value="MAEd">MAEd</option>
                <option value="PhD">PhD</option>
                <option value="MBA">MBA</option>
                <option value="MPA">MPA</option>
                <option value="MSCJ">MSCJ</option>

            </select>

        </div>

        <div class="form-group">

            <label>File Status</label>

            <select id="studentFileStatus">

                <option value="Pending">Pending</option>
                <option value="Complete">Complete</option>

            </select>

        </div>

        <div class="form-group">

            <label>Thesis Status</label>

            <select id="studentThesisStatus">

                <option value="Pending">Pending</option>
                <option value="Complete">Complete</option>

            </select>

        </div>

        <div class="form-group">

            <label>Overall Status</label>

            <select id="studentOverallStatus">

                <option value="Pending">Pending</option>
                <option value="In Progress">In Progress</option>
                <option value="Complete">Complete</option>

            </select>

        </div>

        <div class="form-group">

            <label>Thesis Title</label>

            <input
                type="text"
                id="studentThesisTitle"
                placeholder="Enter thesis title"
            >

        </div>

        <div class="modal-buttons">

            <button
                class="btn-secondary"
                onclick="closeModal()"
            >
                Cancel
            </button>

            <button
                class="btn-primary"
                onclick="saveStudent()"
            >
                Save Student
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================================
   SUPABASE CONNECTION
   ========================================================= */

const SUPABASE_URL =
    "https://yiruvpikzntyiijapknt.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Z95aVweBRCPDWo1XH54GFQ_rrV9GIvk";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   DATA
   ========================================================= */

let students = [];


/* =========================================================
   START
   ========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){
        loadStudents();
    }
);


/* =========================================================
   LOAD STUDENTS
   ========================================================= */

async function loadStudents(){

    const connectionStatus =
        document.getElementById(
            "connectionStatus"
        );

    connectionStatus.textContent =
        "Loading...";

    try{

        const { data, error } =
            await supabaseClient
                .from("students")
                .select("*")
                .order("name", {
                    ascending:true
                });

        if(error){
            throw error;
        }

        students = data || [];

        connectionStatus.textContent =
            "● Online";

        renderTable();

    }catch(error){

        console.error(error);

        connectionStatus.textContent =
            "● Connection Error";

        showError(
            "Unable to load students: " +
            error.message
        );

    }

}


/* =========================================================
   RENDER TABLE
   ========================================================= */

function renderTable(){

    const tbody =
        document.getElementById(
            "studentTableBody"
        );

    const search =
        document.getElementById(
            "searchInput"
        ).value
        .toLowerCase()
        .trim();

    const group =
        document.getElementById(
            "groupFilter"
        ).value;

    const program =
        document.getElementById(
            "programFilter"
        ).value;

    const fileStatus =
        document.getElementById(
            "fileFilter"
        ).value;

    const thesisStatus =
        document.getElementById(
            "thesisFilter"
        ).value;


    let filtered =
        students.filter(student => {

            const name =
                (student.name || "")
                .toLowerCase();

            const title =
                (student.thesis_title || "")
                .toLowerCase();

            const matchesSearch =
                !search ||
                name.includes(search) ||
                title.includes(search);

            const matchesGroup =
                group === "ALL" ||
                student.group === group;

            const matchesProgram =
                program === "ALL" ||
                student.program === program;

            const matchesFile =
                fileStatus === "ALL" ||
                student.file_status === fileStatus;

            const matchesThesis =
                thesisStatus === "ALL" ||
                student.thesis_status === thesisStatus;

            return (
                matchesSearch &&
                matchesGroup &&
                matchesProgram &&
                matchesFile &&
                matchesThesis
            );

        });


    /* Alphabetical sorting */

    filtered.sort((a,b) =>
        (a.name || "")
        .localeCompare(
            b.name || "",
            undefined,
            {
                sensitivity:"base"
            }
        )
    );


    tbody.innerHTML = "";


    if(filtered.length === 0){

        tbody.innerHTML = `
            <tr>
                <td colspan="9" class="empty">
                    No student records found.
                </td>
            </tr>
        `;

    }else{

        filtered.forEach(
            (student,index) => {

                const row =
                    document.createElement("tr");

                row.innerHTML = `

                    <td>
                        ${index + 1}
                    </td>

                    <td>
                        <strong>
                            ${escapeHtml(
                                student.name || ""
                            )}
                        </strong>
                    </td>

                    <td>
                        <span class="group-badge">
                            ${escapeHtml(
                                student.group || ""
                            )}
                        </span>
                    </td>

                    <td>
                        ${programBadge(
                            student.program
                        )}
                    </td>

                    <td>
                        ${statusBadge(
                            student.file_status
                        )}
                    </td>

                    <td>
                        ${statusBadge(
                            student.thesis_status
                        )}
                    </td>

                    <td>
                        ${statusBadge(
                            student.overall_status
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            student.thesis_title || "-"
                        )}
                    </td>

                    <td>

                        <div class="actions">

                            <button
                                class="btn-warning"
                                onclick="editStudent(${student.id})"
                            >
                                Edit
                            </button>

                            <button
                                class="btn-danger"
                                onclick="deleteStudent(${student.id})"
                            >
                                Delete
                            </button>

                        </div>

                    </td>
                `;

                tbody.appendChild(row);

            }
        );

    }


    document.getElementById(
        "recordCount"
    ).textContent =
        filtered.length +
        (
            filtered.length === 1
                ? " record"
                : " records"
        );


    updateDashboard();

}


/* =========================================================
   PROGRAM BADGE
   ========================================================= */

function programBadge(program){

    let className = "";

    if(program === "PhD"){
        className = "phd";
    }

    else if(program === "MAEd"){
        className = "maed";
    }

    else if(program === "MBA"){
        className = "mba";
    }

    else if(program === "MPA"){
        className = "mpa";
    }

    else if(program === "MSCJ"){
        className = "mscj";
    }

    return `
        <span class="program-badge ${className}">
            ${escapeHtml(program || "")}
        </span>
    `;
}


/* =========================================================
   STATUS BADGE
   ========================================================= */

function statusBadge(status){

    let className =
        "status-pending";

    if(status === "Complete"){
        className =
            "status-complete";
    }

    else if(status === "In Progress"){
        className =
            "status-progress";
    }

    return `
        <span class="badge ${className}">
            ${escapeHtml(status || "Pending")}
        </span>
    `;
}


/* =========================================================
   DASHBOARD
   ========================================================= */

function updateDashboard(){

    const group =
        document.getElementById(
            "groupFilter"
        ).value;


    const groupStudents =
        group === "ALL"
            ? students
            : students.filter(
                student =>
                    student.group === group
            );


    document.getElementById(
        "totalCount"
    ).textContent =
        groupStudents.length;


    document.getElementById(
        "filesComplete"
    ).textContent =
        groupStudents.filter(
            student =>
                student.file_status ===
                "Complete"
        ).length;


    document.getElementById(
        "thesisComplete"
    ).textContent =
        groupStudents.filter(
            student =>
                student.thesis_status ===
                "Complete"
        ).length;


    document.getElementById(
        "overallComplete"
    ).textContent =
        groupStudents.filter(
            student =>
                student.overall_status ===
                "Complete"
        ).length;

}


/* =========================================================
   OPEN ADD MODAL
   ========================================================= */

function openAddModal(){

    document.getElementById(
        "modalTitle"
    ).textContent =
        "Add Student";


    document.getElementById(
        "studentId"
    ).value = "";


    document.getElementById(
        "studentName"
    ).value = "";


    document.getElementById(
        "studentGroup"
    ).value =
        "TAGAYTAY GROUP";


    document.getElementById(
        "studentProgram"
    ).value =
        "MAEd";


    document.getElementById(
        "studentFileStatus"
    ).value =
        "Pending";


    document.getElementById(
        "studentThesisStatus"
    ).value =
        "Pending";


    document.getElementById(
        "studentOverallStatus"
    ).value =
        "Pending";


    document.getElementById(
        "studentThesisTitle"
    ).value = "";


    document.getElementById(
        "studentModal"
    ).classList.add("show");

}


/* =========================================================
   EDIT STUDENT
   ========================================================= */

function editStudent(id){

    const student =
        students.find(
            s => Number(s.id) === Number(id)
        );

    if(!student){
        showError(
            "Student record not found."
        );
        return;
    }


    document.getElementById(
        "modalTitle"
    ).textContent =
        "Edit Student";


    document.getElementById(
        "studentId"
    ).value =
        student.id;


    document.getElementById(
        "studentName"
    ).value =
        student.name || "";


    document.getElementById(
        "studentGroup"
    ).value =
        student.group ||
        "TAGAYTAY GROUP";


    document.getElementById(
        "studentProgram"
    ).value =
        student.program ||
        "MAEd";


    document.getElementById(
        "studentFileStatus"
    ).value =
        student.file_status ||
        "Pending";


    document.getElementById(
        "studentThesisStatus"
    ).value =
        student.thesis_status ||
        "Pending";


    document.getElementById(
        "studentOverallStatus"
    ).value =
        student.overall_status ||
        "Pending";


    document.getElementById(
        "studentThesisTitle"
    ).value =
        student.thesis_title || "";


    document.getElementById(
        "studentModal"
    ).classList.add("show");

}


/* =========================================================
   SAVE STUDENT
   ========================================================= */

async function saveStudent(){

    const id =
        document.getElementById(
            "studentId"
        ).value;


    const name =
        document.getElementById(
            "studentName"
        ).value.trim();


    const group =
        document.getElementById(
            "studentGroup"
        ).value;


    const program =
        document.getElementById(
            "studentProgram"
        ).value;


    const fileStatus =
        document.getElementById(
            "studentFileStatus"
        ).value;


    const thesisStatus =
        document.getElementById(
            "studentThesisStatus"
        ).value;


    const overallStatus =
        document.getElementById(
            "studentOverallStatus"
        ).value;


    const thesisTitle =
        document.getElementById(
            "studentThesisTitle"
        ).value.trim();


    if(!name){

        showError(
            "Please enter the student name."
        );

        return;
    }


    const studentData = {

        name:name,

        group:group,

        program:program,

        file_status:fileStatus,

        thesis_status:thesisStatus,

        overall_status:overallStatus,

        thesis_title:thesisTitle

    };


    try{

        let error;


        if(id){

            const result =
                await supabaseClient
                    .from("students")
                    .update(studentData)
                    .eq("id",id);

            error =
                result.error;

        }else{

            const result =
                await supabaseClient
                    .from("students")
                    .insert([
                        studentData
                    ]);

            error =
                result.error;

        }


        if(error){
            throw error;
        }


        closeModal();

        showSuccess(
            id
                ? "Student updated successfully."
                : "Student added successfully."
        );


        await loadStudents();


    }catch(error){

        console.error(error);

        showError(
            "Unable to save student: " +
            error.message
        );

    }

}


/* =========================================================
   DELETE STUDENT
   ========================================================= */

async function deleteStudent(id){

    const student =
        students.find(
            s => Number(s.id) === Number(id)
        );


    if(!student){
        return;
    }


    const confirmed =
        confirm(
            "Are you sure you want to delete " +
            student.name +
            "?"
        );


    if(!confirmed){
        return;
    }


    try{

        const { error } =
            await supabaseClient
                .from("students")
                .delete()
                .eq("id",id);


        if(error){
            throw error;
        }


        showSuccess(
            "Student deleted successfully."
        );


        await loadStudents();


    }catch(error){

        console.error(error);

        showError(
            "Unable to delete student: " +
            error.message
        );

    }

}


/* =========================================================
   CLOSE MODAL
   ========================================================= */

function closeModal(){

    document.getElementById(
        "studentModal"
    ).classList.remove("show");

}


/* =========================================================
   CLICK OUTSIDE MODAL
   ========================================================= */

document.getElementById(
    "studentModal"
).addEventListener(
    "click",
    function(event){

        if(event.target === this){
            closeModal();
        }

    }
);


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   MESSAGES
   ========================================================= */

function showError(message){

    const box =
        document.getElementById(
            "errorBox"
        );

    box.textContent =
        message;

    box.style.display =
        "block";


    setTimeout(
        function(){

            box.style.display =
                "none";

        },
        5000
    );

}


function showSuccess(message){

    const box =
        document.getElementById(
            "successBox"
        );

    box.textContent =
        message;

    box.style.display =
        "block";


    setTimeout(
        function(){

            box.style.display =
                "none";

        },
        3000
    );

}

</script>
